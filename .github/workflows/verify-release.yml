# Validate the actual privately signed draft before making it public.
name: Verify signed draft
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag holding a signed APK
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Verify signed APK in Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NS_SMOKE_PACKAGE: io.github.withite.nsdetector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the signed draft APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NS_TAG: ${{ inputs.tag_name }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['NS_TAG']):
              raise SystemExit('Expected a stable version tag')
          PY
          gh release download "$NS_TAG" --repo "$GH_REPO" --pattern '*.apk' --dir dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@ed009f5318f15b1cf93a191b856c4f1748a2d4c1
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python3 scripts/ns_emulator_smoke.py
      - name: Upload signed-release runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ns-detector-signed-emulator
          path: smoke-output/
          if-no-files-found: ignore
          retention-days: 30
