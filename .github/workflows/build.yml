# NS Detector independent build and preview distribution, 2026.
name: NS Detector
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - NOTICE
      - LICENSE
  workflow_dispatch:
concurrency:
  group: ns-detector-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    name: Evidence and architecture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check all repository contracts
        run: |
          set -euo pipefail
          python3 scripts/ns_check_upstream_coverage.py
          for checker in .github/scripts/check-*.py; do python3 "$checker"; done
          for suite in .github/scripts/test-*.py; do python3 "$suite"; done
          python3 scripts/test_new_detector.py
          python3 capability/selinuxpolicy/data/src/test/python/test_sidtab_native.py
          python3 capability/selinuxpolicy/data/src/test/python/test_proc_attr_native.py
          python3 capability/selinuxpolicy/data/src/test/python/test_avc_lookup_native.py
          python3 capability/selinuxpolicy/data/src/test/python/test_status_abi_native.py
  verify:
    name: Build, tests, lint and SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NS_VERSION_NAME: 1.0.${{ github.run_number }}-preview
      NS_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"
      - name: Run all unit tests and build all four ABIs
        run: |
          printf 'VERSION_NAME=%s\nVERSION_CODE=%s\n' "$NS_VERSION_NAME" "$((10000 + NS_VERSION_CODE))" >> "$GITHUB_ENV"
          ./gradlew --stacktrace :build-logic:test unitTest checkPublicApi :app:assembleDebug \
            -Pnsdetector.versionName="$NS_VERSION_NAME" \
            -Pnsdetector.versionCode="$((10000 + NS_VERSION_CODE))"
      - name: Verify dependencies and publish the headless SDK
        run: |
          ./gradlew --stacktrace buildHealth :sdk:aar:publish :sdk:aar:verifySdkAar
          ./gradlew --stacktrace -p samples/sdk-consumer assembleDebug
      - name: Run Android lint across all application modules
        run: |
          ./gradlew --stop
          ./gradlew --stacktrace :app:lintDebug
      - name: Collect and verify installable artifacts
        env:
          NS_RELEASE_TAG: preview-${{ github.run_number }}
          NS_CHANNEL: preview
        run: python3 scripts/ns_prepare_artifacts.py --variant debug
      - name: Upload APK, SDK, checksums and build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ns-detector-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ns-detector-validation
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-debug.*
            build/reports/dependency-analysis/
            sdk/aar/build/reports/
          if-no-files-found: ignore
          retention-days: 30
  smoke:
    name: Android emulator installation and UI smoke
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ns-detector-build
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0; packaged dependencies
        with:
          api-level: 35
          cores: 4
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          script: python3 scripts/ns_emulator_smoke.py
      - name: Upload screenshots and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ns-detector-emulator
          path: smoke-output/
          if-no-files-found: ignore
          retention-days: 30
  preview:
    name: Publish tested preview APK
    needs: [contracts, verify, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ns-detector-build
          path: dist/
      - name: Publish versioned preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NS_TAG: preview-${{ github.run_number }}
        run: |
          cat > release-notes.md <<'NOTES'
          NS Detector 测试预览版。核心检测离线运行，包含检测证据、本地历史、变化对比和脱敏报告。

          本版本使用测试签名，与正式版使用不同包名。已执行构建、单元测试、lint、SDK 验证和 Android 模拟器启动检查；尚未完成跨厂商真机准确率验证。

          下载 APK 安装；SHA256SUMS 可用于核对文件，build-info.json 记录源码提交与工具链。硬件证明和各厂商运行态能力以实际设备结果为准。
          NOTES
          gh release create "$NS_TAG" dist/* --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --title "NS Detector 1.0.${GITHUB_RUN_NUMBER} Preview" \
            --notes-file release-notes.md --prerelease
